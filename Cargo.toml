[workspace]
members = ["crates/*", "plugins/*", "tools/c182", "tools/xphost"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
egui = { version = "0.36.1", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.36.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader"] }
xplane-airports = { path = "crates/xplane-airports" }
xplane-hud = { path = "crates/xplane-hud" }
xplane-plugin = { path = "crates/xplane-plugin" }
xplane-egui = { path = "crates/xplane-egui" }
c182-ui = { path = "crates/c182-ui" }
uom = { version = "0.38.0", default-features = false, features = ["si", "std", "f32", "f64"] }
xplane-sdk-sys = "0.4.0"
c182-core = { path = "crates/c182-core" }
cc = { version = "1", features = ["parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
