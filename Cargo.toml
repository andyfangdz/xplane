[workspace]
members = ["plugins/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
egui = { version = "0.36.1", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.36.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader"] }
xplane-sdk-sys = "0.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
