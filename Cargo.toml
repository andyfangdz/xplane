[package]
name = "position-aircraft-native"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Native X-Plane 12 PositionAircraft replacement"

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = { version = "0.36.1", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.36.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
