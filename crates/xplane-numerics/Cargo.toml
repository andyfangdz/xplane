[package]
name = "xplane-numerics"
version = "0.1.0"
description = "Numerical compatibility primitives for native simulation: floating-point semantics, interpolation, rotations and byte records"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Scalar `fp::{add, sub, mul, div}` and their `_f32` forms, for differential
# tests against native code. Production code uses `+ - * /`.
runtime-arithmetic = []
# `storage`: native-endian byte records, for differential tests that share
# archived record layouts with native code. Production code uses typed state.
byte-records = []

[dev-dependencies]
# The crate's own tests exercise the runtime arithmetic and byte records.
xplane-numerics = { path = ".", features = ["runtime-arithmetic", "byte-records"] }
