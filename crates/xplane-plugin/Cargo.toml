[package]
name = "xplane-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared safe utilities for native X-Plane plugins"
readme = "README.md"

[features]
opengl = ["dep:windows-sys"]

[dependencies]
xplane-sdk-sys.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
