[package]
name = "xplane-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared safe utilities for native X-Plane plugins"
readme = "README.md"

[features]
panel-image = ["dep:png"]
opengl = ["dep:windows-sys"]

[dependencies]
png = { version = "=0.17.16", optional = true }
xplane-sdk-sys.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Graphics_OpenGL"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
