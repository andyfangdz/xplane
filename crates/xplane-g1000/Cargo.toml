[package]
name = "xplane-g1000"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Draw custom pages and overlays on X-Plane's built-in G1000 displays"
readme = "README.md"

[features]
# Existing consumers can still request this feature. Widgets are always available on Windows.
egui = []
da40 = []
c182 = ["dep:xplane-numerics"]

[dependencies]
ab_glyph = "0.2.32"

[target.'cfg(windows)'.dependencies]
egui.workspace = true
xplane-numerics = { workspace = true, optional = true }
xplane-plugin.workspace = true
xplane-sdk-sys.workspace = true

[[example]]
name = "mfd_page"
crate-type = ["cdylib"]
