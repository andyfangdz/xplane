name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  asset-free:
    # Crates and tools that build and test without the X-Plane install, vendor
    # assets or the private aircraft workspace.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain from rust-toolchain.toml
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt,clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # poweroff180-hud and xgs-rs test binaries need XPLM.dll at run time.
      - name: Test asset-free crates
        run: >-
          cargo test --locked
          -p c182-core -p xplane-rpn -p xplane-gauge-xml -p xplane-plugin
          -p c182-ui -p xplane-egui -p xplane-numerics -p xplane-navdata -p c182-tools
          -p xplane-airports -p xplane-attitude -p xplane-hud
          -p xphost-core -p xphost-native -p xphost-sdk -p xphost
          -p poweroff180 -p poweroff180-attitude -p poweroff180-controller
          -p performance-recorder -p position-aircraft-native -p shuttle-hud-rs

      - name: Fidelity tool tests
        run: python -m unittest discover -s tools/c182-fidelity

      - name: C182 tool tests
        run: python -m unittest discover -s tools/c182/python

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --no-deps --all-targets --workspace -- -D warnings
