name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  asset-free:
    # Crates and tools that build and test without the X-Plane install, vendor
    # assets or the private aircraft workspace.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain from rust-toolchain.toml
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt,clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the headless SDK for native panel tests
        shell: pwsh
        run: |
          cargo build --locked -p xphost-sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = Join-Path $env:RUNNER_TEMP 'xphost-sdk'
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          Copy-Item -LiteralPath 'target/debug/xphost_sdk.dll' -Destination (Join-Path $sdk 'XPLM_64.dll')
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $sdk

      - name: Test asset-free crates
        run: cargo test --locked --workspace --features xplane-plugin/panel-image

      # The RPN ahead-of-time compiler sits behind the off-by-default aot feature.
      - name: Test the RPN aot feature
        run: cargo test --locked -p xplane-rpn --features aot

      - name: Fidelity tool tests
        run: python -m unittest discover -s tools/c182-fidelity

      - name: C182 tool tests
        run: python -m unittest discover -s tools/c182/python

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --no-deps --all-targets --workspace -- -D warnings

      - name: Clippy for the RPN aot feature
        run: cargo clippy --locked --no-deps --all-targets -p xplane-rpn --features aot -- -D warnings
