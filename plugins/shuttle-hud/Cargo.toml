[package]
name = "shuttle-hud-rs"
version = "0.143.0"
edition.workspace = true
license.workspace = true
description = "Native collimated Space Shuttle HUD, landing guidance and staged drag chute"

[lib]
name = "shuttle_hud"
crate-type = ["cdylib", "rlib"]

[dependencies]
xplane-plugin.workspace = true
xplane-sdk-sys.workspace = true
windows-sys = { workspace = true, features = ["Win32_Graphics_OpenGL"] }
