[package]
name = "shuttle-hud-rs"
version = "0.144.0"
edition.workspace = true
license.workspace = true
description = "Native collimated Space Shuttle HUD, landing guidance and staged drag chute"

[lib]
name = "shuttle_hud"
crate-type = ["cdylib", "rlib"]

[dependencies]
uom.workspace = true
xplane-airports.workspace = true
xplane-hud.workspace = true
xplane-plugin = { workspace = true, features = ["opengl"] }
xplane-sdk-sys.workspace = true
windows-sys = { workspace = true, features = ["Win32_Graphics_OpenGL"] }
